version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ev3_mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: tienda_hardware_intelligence
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Autocarga de la BD al iniciar por primera vez:
      - ./db/1_schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./db/2_data.sql:/docker-entrypoint-initdb.d/2_data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmysql"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    container_name: ev3_dashboard
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=mysql
      - DB_NAME=tienda_hardware_intelligence

volumes:
  db_data:
